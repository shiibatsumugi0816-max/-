<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广东技术师范大学 · 科研楼电力监控系统</title>
<style>
/* ===================== 基础 ===================== */
:root{
  --bg:#f1f4f9;
  --panel:#ffffff;
  --line:#e3e9f2;
  --line-2:#eef2f8;
  --text:#0e1b2e;
  --muted:#6b7c94;
  --muted-2:#93a2b6;
  --brand:#15509e;
  --brand-2:#2b7de0;
  --brand-3:#e9f1fd;
  --green:#0f9d75;
  --amber:#d98a06;
  --red:#d93a3a;
  --cyan:#0d93a8;
  --purple:#6b5bd2;
  --shadow:0 1px 2px rgba(16,32,56,.04), 0 8px 24px -12px rgba(16,32,56,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;
  line-height:1.45;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cdd7e5;border-radius:9px;border:2px solid #f1f4f9}
::-webkit-scrollbar-track{background:transparent}

/* ===================== 布局 ===================== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:216px;flex:0 0 216px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;color:#fff;
  background:linear-gradient(140deg,#1a5fb4,#2b7de0);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
  box-shadow:0 4px 10px -3px rgba(43,125,224,.5);letter-spacing:0
}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text strong{font-size:13.5px;letter-spacing:.2px}
.brand-text span{font-size:11px;color:var(--muted)}

.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;color:var(--muted-2);letter-spacing:1px;padding:12px 8px 6px}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;background:transparent;
  color:#4d5f77;font-size:12.8px;border-radius:8px;cursor:pointer;text-align:left;transition:.15s;position:relative
}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.75}
.nav-item:hover{background:#f5f8fc;color:var(--text)}
.nav-item.active{background:var(--brand-3);color:var(--brand);font-weight:600}
.nav-item.active svg{opacity:1}
.nav-item .badge{
  margin-left:auto;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#fdeaea;color:#c92a2a;
  font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center
}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line-2);font-size:11px;color:var(--muted)}
.side-foot .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.side-foot .row:last-child{margin-bottom:0}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:62px;flex:0 0 62px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  position:sticky;top:0;z-index:25;
}
.tb-left{display:flex;flex-direction:column;gap:1px}
.tb-left h1{font-size:15px;font-weight:650;letter-spacing:.2px}
.crumb{font-size:11px;color:var(--muted-2)}
.crumb b{color:var(--brand-2);font-weight:500}
.tb-right{display:flex;align-items:center;gap:10px}
.pill{
  height:28px;padding:0 10px;border-radius:7px;background:#f5f8fc;border:1px solid var(--line-2);
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:#41546c;white-space:nowrap
}
.pill b{font-weight:600;color:var(--text)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(15,157,117,.14)}
.dot.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,157,117,.35)}50%{box-shadow:0 0 0 5px rgba(15,157,117,0)}}
.clock{font-size:12px;color:var(--muted);min-width:150px;text-align:right}
.user{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
.avatar{width:26px;height:26px;border-radius:50%;background:#e9f1fd;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

.content{padding:16px 22px 40px;flex:1}

/* ===================== 通用组件 ===================== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.panel-title{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.panel-title::before{content:"";width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--brand-2),#7ab3f0)}
.hint{font-size:11px;color:var(--muted-2)}
.row-flex{display:flex;align-items:center;gap:8px}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 15px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.18s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(16,32,56,.05),0 14px 30px -16px rgba(16,32,56,.22)}
.kpi::after{content:"";position:absolute;left:0;top:0;width:100%;height:2.5px;background:var(--brand-2);opacity:.9}
.kpi.g::after{background:var(--green)} .kpi.a::after{background:var(--amber)}
.kpi.r::after{background:var(--red)} .kpi.p::after{background:var(--purple)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.kpi-label{font-size:11.5px;color:var(--muted)}
.kpi-ico{width:22px;height:22px;border-radius:6px;background:#f2f6fc;display:flex;align-items:center;justify-content:center;color:var(--brand-2)}
.kpi-ico svg{width:13px;height:13px}
.kpi-value{font-size:25px;font-weight:650;letter-spacing:-.6px;line-height:1.15}
.kpi-value .u{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi-foot{font-size:10.8px;color:var(--muted-2);margin-top:3px;display:flex;align-items:center;gap:5px}
.up{color:var(--red)} .down{color:var(--green)}

.grid-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-top:12px}
.grid-3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,.95fr);gap:12px;margin-top:12px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}

canvas{display:block;width:100%}

.legend{display:flex;gap:14px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* 楼层负荷条 */
.fb-list{display:flex;flex-direction:column;gap:11px;padding-top:2px}
.fb-row{display:grid;grid-template-columns:34px 1fr 56px;align-items:center;gap:9px;font-size:11.5px}
.fb-name{color:#41546c;font-weight:500}
.fb-track{height:8px;border-radius:5px;background:#f0f4fa;overflow:hidden}
.fb-track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#5aa3ee,#2b7de0);transition:width .6s ease}
.fb-row:nth-child(2) .fb-track i{background:linear-gradient(90deg,#4fc3a1,#0f9d75)}
.fb-row:nth-child(3) .fb-track i{background:linear-gradient(90deg,#6bc5d6,#0d93a8)}
.fb-row:nth-child(4) .fb-track i{background:linear-gradient(90deg,#8f83e0,#6b5bd2)}
.fb-row:nth-child(5) .fb-track i{background:linear-gradient(90deg,#e8b45c,#d98a06)}
.fb-row:nth-child(6) .fb-track i{background:linear-gradient(90deg,#ef8f8f,#d93a3a)}
.fb-val{text-align:right;font-weight:600;font-size:11.5px}
.fb-val em{font-style:normal;color:var(--muted-2);font-weight:400;font-size:10px;margin-left:2px}

/* 告警条 */
.al-list{display:flex;flex-direction:column;gap:8px}
.al-item{display:flex;gap:9px;padding:9px 10px;border-radius:8px;background:#fbfcfe;border:1px solid var(--line-2)}
.al-item .bar{width:3px;border-radius:3px;flex:0 0 3px;background:var(--amber)}
.al-item.lv-紧急 .bar{background:var(--red)}
.al-item.lv-严重 .bar{background:#e8760c}
.al-item.lv-提示 .bar{background:#3b8fd6}
.al-main{min-width:0;flex:1}
.al-t{font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.al-d{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.al-meta{font-size:10.5px;color:var(--muted-2);margin-top:4px;display:flex;gap:8px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1.5px 7px;border-radius:999px;font-size:10.5px;font-weight:500;white-space:nowrap}
.chip.red{background:#fdecec;color:#c22a2a}
.chip.amber{background:#fff5e2;color:#a06500}
.chip.blue{background:#e9f1fd;color:#15509e}
.chip.green{background:#e4f6ef;color:#0b7a58}
.chip.gray{background:#eef2f7;color:#5f7086}
.chip.purple{background:#efedfb;color:#5344c0}

.btn{
  height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:#fff;color:#31445c;
  font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap
}
.btn:hover{border-color:#c3d1e3;background:#f8fafd}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#114188}
.btn.danger{color:#c22a2a;border-color:#f2cdcd}
.btn.danger:hover{background:#fdf2f2}
.btn.sm{height:25px;padding:0 9px;font-size:11px;border-radius:6px}
.btn.block{width:100%;justify-content:center}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  text-align:left;font-weight:500;color:var(--muted);padding:7px 10px;background:#f7fafd;
  font-size:10.8px;letter-spacing:.3px;border-bottom:1px solid var(--line)
}
.tbl th:first-child{border-radius:6px 0 0 6px}
.tbl th:last-child{border-radius:0 6px 6px 0}
.tbl td{padding:9px 10px;border-bottom:1px solid #f2f5fa;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#fbfcfe}
.tbl .t-strong{font-weight:600}
.tbl .t-sub{font-size:10.5px;color:var(--muted-2)}
.tbl-wrap{overflow:auto}

/* 开关 */
.sw{width:38px;height:21px;border-radius:999px;background:#d5dde9;position:relative;cursor:pointer;border:0;transition:background .2s;flex:0 0 38px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s,box-shadow .2s;box-shadow:0 1px 3px rgba(16,32,56,.28)}
.sw.on{background:var(--brand-2)}
.sw.on::after{left:19px}
.sw.dim{opacity:.5;cursor:not-allowed}

/* 楼层监控 */
.floor-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ftabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:var(--shadow)}
.ftab{
  width:44px;height:30px;border:0;background:transparent;border-radius:6px;cursor:pointer;
  font-size:12.5px;color:#54657c;font-weight:500;transition:.15s
}
.ftab:hover{background:#f3f7fc}
.ftab.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 6px -1px rgba(21,80,158,.4)}
.floor-title{display:flex;align-items:baseline;gap:10px}
.floor-title h2{font-size:16px;font-weight:650}
.floor-title span{font-size:11.5px;color:var(--muted)}

.floor-wrap{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:12px}
.plan-stage{background:linear-gradient(180deg,#fbfcfe,#f7f9fd);border:1px solid var(--line-2);border-radius:9px;padding:6px 8px 2px}
.plan{display:block;width:100%;height:auto}
.plan text{font-family:inherit;pointer-events:none;user-select:none}
.room{cursor:pointer}
.room rect{transition:opacity .15s,stroke .15s}
.room:hover rect{stroke:#15509e;stroke-width:2.2}
.room.sel rect{stroke:#15509e;stroke-width:2.6}
.plan-legend{display:flex;align-items:center;gap:12px;font-size:10.5px;color:var(--muted);padding:6px 2px 2px;flex-wrap:wrap}
.plan-legend .scale{display:flex;align-items:center;gap:3px}
.plan-legend .scale i{width:16px;height:7px;border-radius:2px;display:block}

.side-col{display:flex;flex-direction:column;gap:12px}
.big-kw{display:flex;align-items:baseline;gap:5px;margin:2px 0 10px}
.big-kw b{font-size:31px;font-weight:650;letter-spacing:-1px;line-height:1}
.big-kw span{font-size:12px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-box{background:#f8fafd;border:1px solid var(--line-2);border-radius:7px;padding:7px 9px}
.stat-box .l{font-size:10.5px;color:var(--muted)}
.stat-box .v{font-size:14px;font-weight:600;margin-top:1px}
.stat-box .v em{font-style:normal;font-size:10px;color:var(--muted-2);font-weight:400;margin-left:2px}

.quick-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.quick{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 9px;cursor:pointer;text-align:left;font-size:11.5px;color:#3b4d64;transition:.15s}
.quick:hover{border-color:#b9cdea;background:#f8fbff}
.quick b{display:block;font-size:11.5px;font-weight:600;color:var(--text);margin-bottom:1px}
.quick span{font-size:10px;color:var(--muted-2)}
.quick.danger:hover{border-color:#efc0c0;background:#fdf4f4}

.hot-list{display:flex;flex-direction:column;gap:9px}
.hot-row{display:grid;grid-template-columns:58px 1fr 48px;gap:8px;align-items:center;font-size:11.5px}
.hot-row .nm{font-weight:600;font-size:11.5px}
.hot-row .ty{font-size:10px;color:var(--muted-2)}
.hot-track{height:6px;border-radius:4px;background:#f0f4fa;overflow:hidden}
.hot-track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#f5c26b,#e0870d)}
.hot-row .vv{text-align:right;font-weight:600}

/* 风险页 */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:4px 0 0}
.gauge{width:100%;max-width:250px}
.gauge-num{font-size:34px;font-weight:650;letter-spacing:-1px}
.gauge-num em{font-size:12px;font-style:normal;font-weight:400;color:var(--muted);margin-left:3px}
.risk-dims{display:flex;flex-direction:column;gap:9px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.dim-row{display:grid;grid-template-columns:74px 1fr 34px;gap:9px;align-items:center;font-size:11.5px;color:#41546c}
.dim-track{height:6px;border-radius:4px;background:#f0f4fa;overflow:hidden}
.dim-track i{display:block;height:100%;border-radius:4px;background:var(--brand-2)}
.dim-val{text-align:right;font-weight:600;color:var(--text)}

.rule-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f2f5fa}
.rule-row:last-child{border-bottom:0;padding-bottom:2px}
.rule-row .rl{flex:1;min-width:0}
.rule-row .rn{font-size:12px;font-weight:500}
.rule-row .rd{font-size:10.5px;color:var(--muted-2);margin-top:1px}

/* 光伏 */
.flow-stage{background:#fbfcfe;border:1px solid var(--line-2);border-radius:9px;padding:4px}
.flow{display:block;width:100%;height:auto}
.flow .dash{stroke-dasharray:5 5;animation:flowmove 1.2s linear infinite}
@keyframes flowmove{to{stroke-dashoffset:-20}}
.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.env-box{background:linear-gradient(160deg,#f7fbf8,#f1f8f4);border:1px solid #e3f0e8;border-radius:8px;padding:9px 10px}
.env-box .l{font-size:10.5px;color:#5b7a6a}
.env-box .v{font-size:16px;font-weight:650;color:#0b7a58;margin-top:1px}
.env-box .v em{font-size:10.5px;font-style:normal;font-weight:400;color:#7a9a8a;margin-left:2px}
.soc{height:9px;border-radius:6px;background:#edf3f9;overflow:hidden;margin:9px 0 6px}
.soc i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#4fc3a1,#0f9d75);transition:width .8s}

/* 抽屉 */
.drawer-wrap{position:fixed;inset:0;z-index:70;display:none}
.drawer-wrap.open{display:block}
.drawer-mask{position:absolute;inset:0;background:rgba(12,26,45,.34);animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{
  position:absolute;right:0;top:0;bottom:0;width:404px;max-width:94vw;background:#fff;
  display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(12,26,45,.16);animation:slide .24s cubic-bezier(.2,.8,.3,1)
}
@keyframes slide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
.dr-head{padding:16px 18px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
.dr-head h3{font-size:17px;font-weight:650;display:flex;align-items:center;gap:8px}
.dr-head .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.dr-close{width:28px;height:28px;border-radius:7px;border:0;background:#f3f6fb;color:#5a6c82;cursor:pointer;font-size:15px;line-height:1}
.dr-close:hover{background:#e9eef6}
.dr-body{flex:1;overflow:auto;padding:14px 18px 20px}
.dr-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;background:#fbfcfe}
.dr-power{background:linear-gradient(135deg,#f4f9ff,#eef5fe);border:1px solid #e0ecfa;border-radius:10px;padding:12px 14px}
.dr-power .l{font-size:11px;color:var(--muted)}
.dr-power .v{font-size:30px;font-weight:650;letter-spacing:-1px;line-height:1.2}
.dr-power .v span{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.dr-power canvas{margin-top:6px}
.sec-title{font-size:11.5px;font-weight:600;color:#41546c;margin:16px 0 7px;display:flex;justify-content:space-between;align-items:center}
.sec-title .hint{font-weight:400}
.dev-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line-2);border-radius:8px;margin-bottom:7px;background:#fff}
.dev-ico{width:28px;height:28px;border-radius:7px;background:#f2f6fc;display:flex;align-items:center;justify-content:center;color:var(--brand);flex:0 0 28px}
.dev-ico svg{width:15px;height:15px}
.dev-main{flex:1;min-width:0}
.dev-name{font-size:12px;font-weight:500}
.dev-sub{font-size:10.5px;color:var(--muted-2)}
.dev-p{font-size:12px;font-weight:600;color:#31445c;min-width:52px;text-align:right}
.dev-p.off{color:#adb9c8;font-weight:400}
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.meta-box{background:#f8fafd;border:1px solid var(--line-2);border-radius:7px;padding:7px 8px}
.meta-box .l{font-size:10px;color:var(--muted-2)}
.meta-box .v{font-size:12.5px;font-weight:600;margin-top:1px}
.notice{border-radius:8px;padding:9px 11px;font-size:11px;line-height:1.55;display:flex;gap:7px}
.notice.red{background:#fdf3f3;border:1px solid #f7dede;color:#a52b2b}
.notice.amber{background:#fffaf0;border:1px solid #f8ebd2;color:#8a5b00}
.notice.blue{background:#f2f8ff;border:1px solid #e0ecfa;color:#1d528f}

/* 弹窗 */
.modal-wrap{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center}
.modal-wrap.open{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(12,26,45,.38)}
.modal{position:relative;width:400px;max-width:92vw;background:#fff;border-radius:12px;padding:20px;box-shadow:0 24px 60px -20px rgba(12,26,45,.4);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
.modal h4{font-size:15px;font-weight:650;margin-bottom:8px}
.modal p{font-size:12.5px;color:var(--muted);line-height:1.6}
.modal .m-act{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#10243f;color:#fff;border-radius:9px;padding:9px 15px;font-size:12.5px;
  box-shadow:0 12px 30px -10px rgba(12,26,45,.5);animation:tin .22s ease;display:flex;gap:8px;align-items:center
}
.toast.ok{background:#0f7a5c}
.toast.warn{background:#8a5b00}
.toast.err{background:#a52b2b}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.chart-tip{
  position:fixed;z-index:130;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:11.5px;box-shadow:0 10px 28px -10px rgba(12,26,45,.28);pointer-events:none;display:none;min-width:120px
}
.chart-tip .tt{font-size:10.5px;color:var(--muted-2);margin-bottom:4px}
.chart-tip .tr{display:flex;align-items:center;gap:7px;margin-top:2px}
.chart-tip .tr i{width:7px;height:7px;border-radius:2px;display:block}
.chart-tip .tr b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}

.donut-wrap{display:flex;align-items:center;gap:14px}
.donut{width:126px;flex:0 0 126px}
.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1}
.dl-row{display:flex;align-items:center;gap:7px;font-size:11.5px}
.dl-row i{width:8px;height:8px;border-radius:2px}
.dl-row span{color:#41546c}
.dl-row b{margin-left:auto;font-weight:600}

.mix-bar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-top:12px;background:#f0f4fa}
.mix-bar i{display:block;height:100%}

@media (max-width:1420px){
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media (max-width:1180px){
  .grid-main,.grid-3,.grid-2{grid-template-columns:1fr}
  .floor-wrap{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .sidebar{display:none}
  .tb-right .pill{display:none}
}

    for (var h = 0; h < upto; h += step) s += fn(h) * step;
    return s;
  }

  /* ---------------- 仿真 ---------------- */
  function simulate() {
    var t = Date.now() / 1000;
    var total = 0;
    state.rooms.forEach(function (r, ri) {
      var sum = 0;
      r.devices.forEach(function (d, di) {
        var target = d.on ? d.nom * (0.86 + 0.09 * Math.sin(t / 9 + d.phase + ri * 0.37) + 0.05 * Math.sin(t / 2.3 + di)) : 0;
        d.p += (target - d.p) * 0.3;
        if (d.p < 0.0005) d.p = 0;
        sum += d.p;
      });
      r.power = sum;
      r.ratio = r.power / r.cap;
      r.temp = 23.6 + (r.type === 'server' ? 6.5 : 0) + r.ratio * 5.2 + Math.sin(t / 21 + ri) * 0.35;
      if (!state.noAccum) {
        r.hist.push(r.power);
        if (r.hist.length > 44) r.hist.shift();
      }
      total += sum;
    });
    state.totalPower = total;

    var h = nowHours();
    var cloud = 0.90 + 0.10 * Math.sin(t / 27) + 0.03 * Math.sin(t / 5);
    state.pvPower = Math.max(0, pvAt(h) * cloud);

    // 逆变器
    var shares = [60, 60, 55, 55, 50, 46];
    var sumShare = shares.reduce(function (a, b) { return a + b; }, 0);
    state.pv.inv = shares.map(function (s, i) {
      var p = state.pvPower * (s / sumShare) * (0.97 + 0.03 * Math.sin(t / 13 + i));
      return {
        id: 'INV-0' + (i + 1),
        loc: ['屋顶东区', '屋顶东区', '屋顶西区', '屋顶西区', '连廊雨棚', '连廊雨棚'][i],
        cap: s, p: p,
        eff: 97.4 - Math.abs(Math.sin(t / 19 + i)) * 0.7,
        temp: 36 + p / s * 16,
        online: i !== 5 || state.pvPower > 1
      };
    });

    var surplus = state.pvPower - state.totalPower * 0.55;
    state.pv.chg = surplus > 1 ? Math.min(surplus, 42) : -Math.min(30, state.totalPower * 0.04);

    if (!state.noAccum) {
      state.energyToday += state.totalPower * (1.5 / 3600);
      state.pvEnergyToday += state.pvPower * (1.5 / 3600);
    }
  }

  /* ---------------- 数值派生 ---------------- */
  function pendingAlerts() { return state.alerts.filter(function (a) { return a.status === 'pending'; }); }
  function riskScore() {
    var s = 100;
    pendingAlerts().forEach(function (a) {
      s -= a.level === '紧急' ? 14 : a.level === '严重' ? 9 : 3;
    });
    return clamp(Math.round(s), 0, 100);
  }
  function floorPower(f) {
    return state.rooms.reduce(function (s, r) { return s + (r.floor === f ? r.power : 0); }, 0);
  }
  function energyMix() {
    var m = { ac: 0, socket: 0, light: 0, av: 0, fresh: 0 };
    state.rooms.forEach(function (r) { r.devices.forEach(function (d) { m[d.key] += d.p; }); });
    var total = 0; Object.keys(m).forEach(function (k) { total += m[k]; });
    return [
      { key: 'ac', name: '空调系统', color: '#2b7de0', v: total ? m.ac / total * 100 : 0, kw: m.ac },
      { key: 'socket', name: '实验设备', color: '#0d93a8', v: total ? m.socket / total * 100 : 0, kw: m.socket },
      { key: 'light', name: '照明', color: '#6b5bd2', v: total ? m.light / total * 100 : 0, kw: m.light },
      { key: 'av', name: '多媒体', color: '#d98a06', v: total ? m.av / total * 100 : 0, kw: m.av },
      { key: 'fresh', name: '新风及其他', color: '#0f9d75', v: total ? m.fresh / total * 100 : 0, kw: m.fresh }
    ];
  }
  function onlineDevices() {
    var on = 0, total = 0;
    state.rooms.forEach(function (r) { r.devices.forEach(function (d) { total++; if (d.on) on++; }); });
    return { on: on, total: total };
  }
  function hhmm(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

  /* ---------------- 折线图 ---------------- */
  function niceMax(v) {
    if (!v || v <= 0) return 10;
    var exp = Math.floor(Math.log10(v)), base = Math.pow(10, exp), n = v / base;
    var steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) if (n <= steps[i]) return steps[i] * base;
    return 10 * base;
  }
  function lineChart(cv, cfg) {
    if (!cv) return;
    cv._cfg = cfg; cv._hi = -1;
    paint(cv);
    if (!cv._bound) {
      cv._bound = true;
      cv.addEventListener('mousemove', function (e) { onHover(cv, e); });
      cv.addEventListener('mouseleave', function () {
        cv._hi = -1; paint(cv);
        $('#tip').style.display = 'none';
        document.body.style.cursor = '';
      });
    }
  }
  function paint(cv) {
    var cfg = cv._cfg; if (!cfg) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = cv.clientWidth || 640, H = cfg.height || 232;
    if (W < 60) return;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.height = H + 'px';
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var pad = { l: 44, r: 14, t: 18, b: 26 };
    var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    var n = cfg.labels.length, i, j;
    var max = cfg.yMax;
    if (!max) {
      max = 0;
      cfg.series.forEach(function (s) { s.data.forEach(function (v) { if (v != null && v > max) max = v; }); });
      max = niceMax(max * 1.12);
    }
    var X = function (idx) { return pad.l + pw * (idx / (n - 1)); };
    var Y = function (v) { return pad.t + ph * (1 - v / max); };

    ctx.font = '10px Inter, "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'middle';
    for (i = 0; i <= 4; i++) {
      var v = max * i / 4, yy = Y(v);
      ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W - pad.r, yy);
      ctx.strokeStyle = i === 0 ? '#e0e7f1' : '#f1f5fa';
      ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#9aa9bd'; ctx.textAlign = 'right';
      ctx.fillText(max >= 100 ? Math.round(v) : v.toFixed(1), pad.l - 8, yy);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#9aa9bd';
    cfg.labels.forEach(function (lb, idx) {
      if (idx % (cfg.labelEvery || 4) !== 0 && idx !== n - 1) return;
      ctx.fillText(lb, X(idx), pad.t + ph + 8);
    });

    // 面积
    cfg.series.forEach(function (s) {
      if (!s.fill) return;
      var last = -1;
      s.data.forEach(function (val, idx) { if (val != null) last = idx; });
      if (last < 0) return;
      var g = ctx.createLinearGradient(0, pad.t, 0, pad.t + ph);
      g.addColorStop(0, hexA(s.color, 0.22)); g.addColorStop(1, hexA(s.color, 0.01));
      ctx.beginPath(); ctx.moveTo(X(0), Y(s.data[0] == null ? 0 : s.data[0]));
      for (j = 0; j <= last; j++) { if (s.data[j] != null) ctx.lineTo(X(j), Y(s.data[j])); }
      ctx.lineTo(X(last), pad.t + ph); ctx.lineTo(X(0), pad.t + ph); ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
    });

    // 折线
    cfg.series.forEach(function (s) {
      ctx.beginPath();
      var started = false;
      for (j = 0; j < n; j++) {
        var val = s.data[j];
        if (val == null) { started = false; continue; }
        if (!started) { ctx.moveTo(X(j), Y(val)); started = true; }
        else ctx.lineTo(X(j), Y(val));
      }
      ctx.strokeStyle = s.color; ctx.lineWidth = s.width || 2;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      if (s.dash) ctx.setLineDash([5, 4]); else ctx.setLineDash([]);
      ctx.stroke(); ctx.setLineDash([]);

      // 末端点
      var last = -1;
      s.data.forEach(function (val, idx) { if (val != null) last = idx; });
      if (last >= 0 && !s.dash) {
        ctx.beginPath(); ctx.arc(X(last), Y(s.data[last]), 3.2, 0, 6.2832);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.lineWidth = 2.2; ctx.strokeStyle = s.color; ctx.stroke();
      }
    });

    // 悬停参考线
    if (cv._hi >= 0 && cv._hi < n) {
      var hx = X(cv._hi);
      ctx.beginPath(); ctx.moveTo(hx, pad.t); ctx.lineTo(hx, pad.t + ph);
      ctx.strokeStyle = '#b9c8da'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
      cfg.series.forEach(function (s) {
        var val = s.data[cv._hi];
        if (val == null) return;
        ctx.beginPath(); ctx.arc(hx, Y(val), 3.4, 0, 6.2832);
        ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = s.color; ctx.stroke();
      });
    }
    cv._meta = { pad: pad, pw: pw, ph: ph, n: n, max: max, W: W, H: H };
  }
  function onHover(cv, e) {
    var m = cv._meta; if (!m) return;
    var rect = cv.getBoundingClientRect();
    var x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (x < m.pad.l - 6 || x > m.W - m.pad.r + 6) { $('#tip').style.display = 'none'; cv._hi = -1; paint(cv); return; }
    var idx = Math.round((x - m.pad.l) / m.pw * (m.n - 1));
    idx = clamp(idx, 0, m.n - 1);
    if (idx !== cv._hi) { cv._hi = idx; paint(cv); }
    var cfg = cv._cfg;
    var html = '<div class="tt">' + cfg.tipLabel(idx) + '</div>';
    var has = false;
    cfg.series.forEach(function (s) {
      var v = s.data[idx];
      if (v == null) return;
      has = true;
      html += '<div class="tr"><i style="background:' + s.color + '"></i>' + s.name +
        '<b>' + nf(v, 1) + ' ' + (s.unit || cfg.unit || 'kW') + '</b></div>';
    });
    if (!has) { $('#tip').style.display = 'none'; return; }
    var tip = $('#tip');
    tip.innerHTML = html;
    tip.style.display = 'block';
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - tw - 12, e.clientX + 14) + 'px';
    tip.style.top = Math.max(8, Math.min(window.innerHeight - th - 12, e.clientY - th - 10)) + 'px';
  }

  function spark(cv, data, color) {
    if (!cv) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = cv.clientWidth || 320, H = 46;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.height = H + 'px';
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!data.length) return;
    var max = Math.max.apply(null, data) * 1.15 || 1;
    var X = function (i) { return 2 + (W - 4) * (i / Math.max(1, data.length - 1)); };
    var Y = function (v) { return H - 4 - (H - 8) * (v / max); };
    ctx.beginPath(); ctx.moveTo(X(0), Y(data[0]));
    data.forEach(function (v, i) { ctx.lineTo(X(i), Y(v)); });
    ctx.lineTo(X(data.length - 1), H - 2); ctx.lineTo(X(0), H - 2); ctx.closePath();
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, hexA(color, 0.26)); g.addColorStop(1, hexA(color, 0));
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); ctx.moveTo(X(0), Y(data[0]));
    data.forEach(function (v, i) { ctx.lineTo(X(i), Y(v)); });
    ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(X(data.length - 1), Y(data[data.length - 1]), 2.6, 0, 6.2832);
    ctx.fillStyle = color; ctx.fill();
  }

  function donutSVG(items, total) {
    var r = 52, c = 2 * Math.PI * r, off = 0;
    var arcs = items.map(function (it) {
      var len = c * it.v / 100;
      var s = '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="' + it.color + '" stroke-width="17" ' +
        'stroke-dasharray="' + (Math.max(0, len - 1.5)) + ' ' + (c - Math.max(0, len - 1.5)) + '" ' +
        'stroke-dashoffset="' + (-off) + '" transform="rotate(-90 66 66)"/>';
      off += len; return s;
    }).join('');
    return '<svg viewBox="0 0 132 132" class="donut">' +
      '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="#f1f5fa" stroke-width="17"/>' + arcs +
      '<text x="66" y="62" text-anchor="middle" font-size="17" font-weight="650" fill="#0e1b2e">' + nf(total, 0) + '</text>' +
      '<text x="66" y="79" text-anchor="middle" font-size="9.5" fill="#93a2b6">当前总功率 kW</text></svg>';
  }

    var r = 78, cx = 110, cy = 104, arc = Math.PI * r, len = arc * score / 100;
    var d = 'M' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy;
    return '<svg viewBox="0 0 220 124" class="gauge">' +
      '<path d="' + d + '" fill="none" stroke="#eef2f8" stroke-width="13" stroke-linecap="round"/>' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="13" stroke-linecap="round" stroke-dasharray="' + len + ' ' + arc + '"/>' +
      '<text x="' + cx + '" y="72" text-anchor="middle" font-size="34" font-weight="650" fill="#0e1b2e">' + score + '</text>' +
      '<text x="' + cx + '" y="92" text-anchor="middle" font-size="10" fill="#93a2b6">安全评分 / 100</text>' +
      '<text x="' + (cx - r) + '" y="' + (cy + 14) + '" text-anchor="middle" font-size="9" fill="#b6c4d6">0</text>' +

  /* ---------------- 楼层监控 ---------------- */
  function loadFill(ratio, off) {
    if (off) return '#f2f5fa';
    if (ratio > 0.90) return '#f7b7b7';
    if (ratio > 0.75) return '#fbd8a4';
    if (ratio > 0.55) return '#cfe4fa';
    if (ratio > 0.30) return '#e3eefb';
    return '#edf4fc';
  }

  function planSVG(floor) {
    var rooms = state.rooms.filter(function (r) { return r.floor === floor; });
    var s = '<svg class="plan" viewBox="0 0 860 600" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect x="70" y="70" width="720" height="460" rx="8" fill="#ffffff" stroke="#c7d5e6" stroke-width="3"/>';
    s += '<rect x="190" y="190" width="480" height="220" fill="#f2f7fd" stroke="#dae5f2" stroke-dasharray="8 6"/>';
    s += '<circle cx="430" cy="288" r="26" fill="none" stroke="#dde8f4" stroke-width="1.5"/>';
    s += '<text x="430" y="286" text-anchor="middle" font-size="12" fill="#a7b8cc" letter-spacing="3">中庭</text>';
    s += '<text x="430" y="304" text-anchor="middle" font-size="9" fill="#bac8d9" letter-spacing="1">采光天井 · 480 ㎡</text>';
    s += '<text x="430" y="322" text-anchor="middle" font-size="9" fill="#bac8d9">' + floor + 'F 楼层平面 · 23 间</text>';
    // 指北针
    s += '<g transform="translate(818,96)"><path d="M0,-16 L6,4 L0,0 L-6,4 Z" fill="#9fb0c6"/><text x="0" y="18" text-anchor="middle" font-size="9" fill="#aebdd0">N</text></g>';

    rooms.forEach(function (r, i) {
      var g = GEO[i];
      var ratio = clamp(r.ratio, 0, 1.6);
      var fill = loadFill(ratio, r.power < 0.02);
      var cx = g.x + g.w / 2, cy = g.y + g.h / 2;
      var small = g.h < 62;
      s += '<g class="room' + (state.openRoom === r.id ? ' sel' : '') + '" data-id="' + r.id + '">';
      s += '<rect x="' + (g.x + 1.2) + '" y="' + (g.y + 1.2) + '" width="' + (g.w - 2.4) + '" height="' + (g.h - 2.4) + '" rx="2.5" fill="' + fill + '" stroke="#ffffff" stroke-width="1.5"/>';
      s += '<text x="' + cx + '" y="' + (small ? cy - 3 : cy - 15) + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b3352">' + r.id + '</text>';
      if (!small) s += '<text x="' + cx + '" y="' + (cy + 1) + '" text-anchor="middle" font-size="8.6" fill="#7c8ea6">' + r.typeName + '</text>';
      s += '<text class="kw" x="' + cx + '" y="' + (small ? cy + 10 : cy + 17) + '" text-anchor="middle" font-size="9.4" fill="#54687f">' + r.power.toFixed(1) + ' kW</text>';
      if (ratio > 0.9) s += '<circle cx="' + (g.x + g.w - 9) + '" cy="' + (g.y + 9) + '" r="3.2" fill="#d93a3a"/>';
      s += '</g>';
    });
    s += '</svg>';
    return s;
  }

  function liveFloors(force) {
    var f = state.floor;
    var rooms = state.rooms.filter(function (r) { return r.floor === f; });
    var total = 0, on = 0, off = 0, high = 0;
    rooms.forEach(function (r) {
      total += r.power;
      r.devices.forEach(function (d) { if (d.on) on++; else off++; });
      if (r.ratio > 0.75) high++;
      var ref = state.planRefs[r.id];
      if (ref) {
        ref.kw.textContent = r.power.toFixed(1) + ' kW';
        ref.rect.setAttribute('fill', loadFill(clamp(r.ratio, 0, 1.6), r.power < 0.02));
      }
    });
    var setTxt = function (id, t) { var e = $('#' + id); if (e) e.textContent = t; };
    setTxt('fKw', nf(total, 1));
    var e1 = $('#fDevOn'); if (e1) e1.innerHTML = on + ' <em>台</em>';
    var e2 = $('#fDevOff'); if (e2) e2.innerHTML = off + ' <em>台</em>';
    var e3 = $('#fHigh'); if (e3) e3.innerHTML = high + ' <em>间</em>';
    var e4 = $('#fDens'); if (e4) e4.innerHTML = (total * 1000 / 2106).toFixed(1) + ' <em>W/㎡</em>';

    var hot = $('#hotList');
    if (hot) {
      var top = rooms.slice().sort(function (a, b) { return b.power - a.power; }).slice(0, 4);
      var mx = top[0] ? top[0].power : 1;
      hot.innerHTML = top.map(function (r) {
        return '<div class="hot-row"><div><div class="nm">' + r.id + '</div><div class="ty">' + r.typeName + '</div></div>' +
          '<div class="hot-track"><i style="width:' + (r.power / mx * 100).toFixed(0) + '%"></i></div>' +
          '<div class="vv num">' + r.power.toFixed(1) + '</div></div>';
      }).join('');
    }
    if (state.openRoom && state.map[state.openRoom] && $('.drawer-wrap').classList.contains('open')) {
      liveDrawer();
    }
  }

      '<path class="dash" d="M208 144 L170 144" stroke="#0f9d75" stroke-width="2" fill="none" marker-end="url(#ar)"/>' +
      '<path class="dash" d="M160 150 L160 226" stroke="#6b5bd2" stroke-width="2" fill="none" marker-end="url(#ar)"/>' +
      '<circle cx="160" cy="146" r="5" fill="#fff" stroke="#8fa6c0" stroke-width="1.6"/>' +
      '</svg>';
  }

  function drawSolarChart() {
    var cv = $('#cvSolar'); if (!cv) return;
    var nowH = nowHours();
    var labels = [], pv = [], load = [];
    for (var h = 0; h <= 24; h++) {
      labels.push(h === 24 ? '24:00' : pad2(h) + ':00');
      if (h <= nowH + 0.001) { pv.push(pvAt(h)); load.push(loadAt(h) * state.energyFactor); }
      else { pv.push(null); load.push(null); }
    }
    pv[pv.length - 1] = state.pvPower;
    load[load.length - 1] = state.totalPower;
    lineChart(cv, {
      labels: labels, height: 236, unit: 'kW', labelEvery: 4,
      series: [
        { name: '建筑负荷', color: '#2b7de0', data: load, width: 1.8, dash: true },
        { name: '光伏出力', color: '#e9b949', data: pv, width: 2.4, fill: true }
      ],
      tipLabel: function (i) { return labels[i]; }
    });
  }

  function liveSolar() {
    var setTxt = function (id, t) { var e = $('#' + id); if (e) e.textContent = t; };
    var selfUse = state.pvPower > 0 ? Math.min(state.pvPower, state.totalPower) : 0;
    var selfRate = state.pvPower > 1 ? selfUse / state.pvPower * 100 : 0;
    setTxt('sPower', nf(state.pvPower, 1));
    setTxt('sToday', nf(state.pvEnergyToday, 0));
    setTxt('sSelf', nf(selfRate, 1));
    setTxt('sTotal', nf((state.pvTotal + state.pvEnergyToday) / 1000, 1));
    setTxt('sCO2', nf((state.pvTotal + state.pvEnergyToday) * 0.5703 / 1000, 1));
    setTxt('coverRate', (state.totalPower > 0 ? state.pvPower / state.totalPower * 100 : 0).toFixed(0) + '%');
    setTxt('socVal', state.pv.soc + '% · 146 kWh');
    setTxt('essP', Math.abs(state.pv.chg).toFixed(1));
    setTxt('essChg', nf(96 + state.pvEnergyToday * 0.03, 0));
    setTxt('essDis', nf(78 + Math.abs(state.pv.chg) * 0.4, 0));
    setTxt('fl-pv', state.pvPower.toFixed(0) + ' kW');
    setTxt('fl-load', state.totalPower.toFixed(0) + ' kW');
    setTxt('fl-ess', Math.abs(state.pv.chg).toFixed(0) + ' kW');
    setTxt('fl-grid', Math.max(0, state.totalPower - state.pvPower - state.pv.chg).toFixed(0) + ' kW');
    var sb = $('#socBar'); if (sb) sb.style.width = state.pv.soc + '%';
    setTxt('envCoal', nf((state.pvTotal + state.pvEnergyToday) * 0.0004, 1));
    setTxt('envTree', nf((state.pvTotal + state.pvEnergyToday) * 0.0559, 0));
    setTxt('envCO2', nf((state.pvTotal + state.pvEnergyToday) * 0.5703 / 1000, 1));
    setTxt('envMoney', nf((state.pvTotal + state.pvEnergyToday) * 0.653 / 10000, 2));
    state.pv.inv.forEach(function (inv) {
      var p = $('#ip' + inv.id), e = $('#ie' + inv.id), st = $('#ist' + inv.id);
      if (p) p.textContent = inv.p.toFixed(1) + ' kW';
      if (e) e.textContent = inv.eff.toFixed(1) + '% / ' + inv.temp.toFixed(0) + '℃';
      if (st) { st.textContent = inv.online ? '运行' : '待机'; st.className = 'chip ' + (inv.online ? 'green' : 'gray'); }
    });
  }

  /* ---------------- 抽屉：房间详情与远程控制 ---------------- */
  function openRoom(id) {
    state.openRoom = id;
    var r = state.map[id]; if (!r) return;
    $$('.room').forEach(function (g) { g.classList.toggle('sel', g.getAttribute('data-id') === id); });
    $('#drawer').classList.add('open');
    renderDrawer();
  }
  function closeDrawer() {
    $('#drawer').classList.remove('open');
    state.openRoom = null;
    $$('.room').forEach(function (g) { g.classList.remove('sel'); });
  }
  function renderDrawer() {
    var r = state.map[state.openRoom]; if (!r) return;
    var anyOn = r.devices.some(function (d) { return d.on; });
    var alert = pendingAlerts().filter(function (a) { return a.room === r.id; })[0];
    var html = '<div class="dr-head"><div><h3>' + r.id +
      '<span class="chip ' + (anyOn ? 'green' : 'gray') + '">' + (anyOn ? '用电中' : '全部关闭') + '</span></h3>' +
      '<div class="sub">' + r.floor + 'F · ' + r.typeName + ' · ' + r.wing + '侧 · 额定容量 ' + r.cap.toFixed(1) + ' kW</div></div>' +
      '<button class="dr-close" data-act="close-drawer">✕</button></div>' +
      '<div class="dr-body">' +
      '<div class="dr-power"><div class="l">实时有功功率</div>' +
      '<div class="v"><span id="drKw">' + r.power.toFixed(2) + '</span><span>kW</span></div>' +
      '<canvas id="drSpark"></canvas></div>' +
      '<div class="sec-title">设备远程控制<span class="hint">' + r.devices.filter(function (d) { return d.on; }).length + ' / ' + r.devices.length + ' 开启</span></div>' +
      r.devices.map(function (d) {
        return '<div class="dev-row"><div class="dev-ico">' + ICO[d.key] + '</div>' +
          '<div class="dev-main"><div class="dev-name">' + DEVICE_META[d.key].name + '</div>' +
          '<div class="dev-sub">额定 ' + d.nom.toFixed(1) + ' kW · ' + (d.on ? '运行中' : '已关闭') + '</div></div>' +
          '<div class="dev-p' + (d.on ? '' : ' off') + '" id="dp-' + d.key + '">' + d.p.toFixed(2) + ' kW</div>' +
          '<button class="sw' + (d.on ? ' on' : '') + '" data-act="dev-toggle" data-room="' + r.id + '" data-key="' + d.key + '"></button></div>';
      }).join('') +
      '<div class="sec-title">运行参数</div>' +
      '<div class="meta-grid">' +
      '<div class="meta-box"><div class="l">负载率</div><div class="v" id="drRatio">' + (r.ratio * 100).toFixed(0) + '%</div></div>' +
      '<div class="meta-box"><div class="l">环境温度</div><div class="v" id="drTemp">' + r.temp.toFixed(1) + '℃</div></div>' +
      '<div class="meta-box"><div class="l">电压 / 电流</div><div class="v" id="drVI">220.4V</div></div>' +
      '</div>' +
      (alert ? '<div class="notice red" style="margin-top:12px">⚠ ' + alert.type + '：' + alert.msg + '</div>' :
        r.ratio > 0.75 ? '<div class="notice amber" style="margin-top:12px">该房间负载率已达 ' + (r.ratio * 100).toFixed(0) + '%，建议关闭部分非必要设备。</div>' :
          '<div class="notice blue" style="margin-top:12px">设备运行正常，无越限告警。控制指令下发后 1 秒内生效。</div>') +
      '</div>' +
      '<div class="dr-foot"><button class="btn block" data-act="drawer-off">一键断电</button>' +
      '<button class="btn block primary" data-act="drawer-on">全部恢复</button></div>';
    $('#drawerPanel').innerHTML = html;
    var cv = $('#drSpark');
    if (cv) spark(cv, r.hist.length > 2 ? r.hist.slice(-30) : [0, 0, 0], '#2b7de0');
  }
  function liveDrawer() {
    var r = state.map[state.openRoom]; if (!r) return;
    var kw = $('#drKw'); if (!kw) return;
    kw.textContent = r.power.toFixed(2);
    var ratio = $('#drRatio'); if (ratio) ratio.textContent = (r.ratio * 100).toFixed(0) + '%';
    var temp = $('#drTemp'); if (temp) temp.textContent = r.temp.toFixed(1) + '℃';
    var vi = $('#drVI'); if (vi) vi.textContent = (219 + Math.sin(state.tick / 7) * 2.4).toFixed(1) + 'V';
    r.devices.forEach(function (d) {
      var e = $('#dp-' + d.key);
      if (e) { e.textContent = d.p.toFixed(2) + ' kW'; e.className = 'dev-p' + (d.on ? '' : ' off'); }
    });
    var cv = $('#drSpark');
    if (cv) spark(cv, r.hist.length > 2 ? r.hist.slice(-30) : [0, 0, 0], '#2b7de0');
  }

  /* ---------------- 提示 / 弹窗 ---------------- */
  var toastTimer = null;
  function toast(msg, type) {
    var box = $('#toast');
    var el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
      setTimeout(function () { el.remove(); }, 320);
    }, 2200);
  }
  function askConfirm(opt) {
    state.pendingConfirm = opt.onOk;
    $('#modalBox').innerHTML = '<h4>' + opt.title + '</h4><p>' + opt.desc + '</p>' +
      '<div class="m-act"><button class="btn" data-act="close-modal">取消</button>' +
      '<button class="btn ' + (opt.danger ? 'danger' : 'primary') + '" data-act="modal-ok">' + (opt.ok || '确认执行') + '</button></div>';
    $('#modal').classList.add('open');
  }

  /* ---------------- 交互 ---------------- */
  function go(tab) {
    state.tab = tab;
    closeDrawer();
    $('#modal').classList.remove('open');
    var titles = { overview: '总览驾驶舱', floors: '楼层实时监控', risk: '风险防控中心', solar: '光伏发电监测' };
    $('#pageTitle').textContent = titles[tab] || '';
    $$('.nav-item').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
    if (tab === 'overview') renderOverview();
    else if (tab === 'floors') renderFloors();
    else if (tab === 'risk') renderRisk();
    else if (tab === 'solar') renderSolar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setDevices(rooms, keys, on) {
    var n = 0;
    rooms.forEach(function (r) {
      r.devices.forEach(function (d) {
        if (keys.indexOf(d.key) >= 0 && d.on !== on) { d.on = on; n++; }
      });
    });
    return n;
  }

  document.addEventListener('click', function (e) {
    var nav = e.target.closest('.nav-item');
    if (nav) { go(nav.getAttribute('data-tab')); return; }

    var ftab = e.target.closest('.ftab');
    if (ftab) {
      state.floor = +ftab.getAttribute('data-floor');
      closeDrawer();
      renderFloors();
      return;
    }

    var room = e.target.closest('.room');
    if (room) { openRoom(room.getAttribute('data-id')); return; }

    var act = e.target.closest('[data-act]');
    if (!act) return;
    var a = act.getAttribute('data-act');

    if (a === 'close-drawer') { closeDrawer(); return; }
    if (a === 'close-modal') { $('#modal').classList.remove('open'); state.pendingConfirm = null; return; }
    if (a === 'modal-ok') {
      var fn = state.pendingConfirm;
      $('#modal').classList.remove('open'); state.pendingConfirm = null;
      if (fn) fn();
      return;
    }
    if (a === 'go-risk') { go('risk'); return; }

    if (a === 'dev-toggle') {
      var rm = state.map[act.getAttribute('data-room')], key = act.getAttribute('data-key');
      if (!rm) return;
      var dev = rm.devices.filter(function (d) { return d.key === key; })[0];
      if (!dev) return;
      dev.on = !dev.on;
      renderDrawer();
      toast(rm.id + ' ' + DEVICE_META[key].name + '已' + (dev.on ? '开启' : '关闭'), dev.on ? 'ok' : 'warn');
      return;
    }

    if (a === 'drawer-off' || a === 'drawer-on') {
      var r = state.map[state.openRoom]; if (!r) return;
      var on = a === 'drawer-on';
      if (!on) {
        askConfirm({
          title: '确认对该房间断电？', danger: true, ok: '确认断电',
          desc: '将断开 ' + r.id + ' 房间的全部 ' + r.devices.length + ' 类用电设备（' + r.devices.map(function (d) { return DEVICE_META[d.key].name; }).join('、') + '），可能影响正在进行的实验。',
          onOk: function () {
            r.devices.forEach(function (d) { d.on = false; });
            renderDrawer(); toast(r.id + ' 已执行一键断电', 'err');
          }
        });
        return;
      }
      r.devices.forEach(function (d) { d.on = true; });
      renderDrawer(); toast(r.id + ' 全部设备已恢复供电', 'ok');
      return;
    }

    var rooms = state.rooms.filter(function (r2) { return r2.floor === state.floor; });
    if (a === 'floor-off-light') { var n1 = setDevices(rooms, ['light'], false); toast(state.floor + 'F 照明已关闭（' + n1 + ' 路）', 'warn'); renderFloors(); return; }
    if (a === 'floor-off-ac') { var n2 = setDevices(rooms, ['ac'], false); toast(state.floor + 'F 空调已关闭（' + n2 + ' 路）', 'warn'); renderFloors(); return; }
    if (a === 'floor-on-all') { var n3 = setDevices(rooms, ['light', 'ac', 'av', 'socket', 'fresh'], true); toast(state.floor + 'F 全部设备已恢复（' + n3 + ' 路）', 'ok'); renderFloors(); return; }
    if (a === 'floor-off-all') {
      askConfirm({
        title: '确认' + state.floor + 'F 全层断电？', danger: true, ok: '确认全层断电',
        desc: '该操作将断开 ' + state.floor + 'F 全部 23 个房间的所有用电设备，涉及实验室精密仪器，请确认已做好数据保存与设备保护。',
        onOk: function () {
          var n = setDevices(rooms, ['light', 'ac', 'av', 'socket', 'fresh'], false);
          toast(state.floor + 'F 已全层断电（' + n + ' 路）', 'err');
          renderFloors();
        }
      });
      return;
    }

    if (a === 'alert-handle' || a === 'alert-cut') {
      var id = act.getAttribute('data-id');
      var al = state.alerts.filter(function (x) { return x.id === id; })[0];
      if (!al) return;
      if (a === 'alert-cut') {
        askConfirm({
          title: '断电路由确认', danger: true, ok: '断电并处置',
          desc: '将对 ' + al.room + ' 房间执行断电，并联动关闭该回路。告警：' + al.msg,
          onOk: function () {
            var rr = state.map[al.room];
            if (rr) rr.devices.forEach(function (d) { d.on = false; });
            al.status = 'done';
            toast(al.room + ' 已断电，告警 ' + al.id + ' 处置完成', 'ok');
            renderRisk();
          }
        });
        return;
      }
      al.status = 'done';
      toast('告警 ' + al.id + ' 已处置', 'ok');
      renderRisk();
      return;
    }

    if (a === 'handle-all') {
      var cnt = pendingAlerts().length;
      if (!cnt) { toast('当前无待处置告警', 'ok'); return; }
      askConfirm({
        title: '批量处置 ' + cnt + ' 条告警？', ok: '确认处置',
        desc: '系统将记录处置人、时间与处置措施，并同步至校园能耗管理平台。',
        onOk: function () {
          state.alerts.forEach(function (x) { if (x.status === 'pending') x.status = 'done'; });
          toast('已批量处置 ' + cnt + ' 条告警', 'ok');
          renderRisk();
        }
      });
      return;
    }

    if (a === 'rule-toggle') {
      var k = act.getAttribute('data-key');
      var rule = state.rules.filter(function (x) { return x.key === k; })[0];
      if (!rule) return;
      rule.on = !rule.on;
      act.classList.toggle('on', rule.on);
      toast('规则「' + rule.name + '」已' + (rule.on ? '启用' : '停用'), rule.on ? 'ok' : 'warn');
      return;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('#modal').classList.contains('open')) {
      $('#modal').classList.remove('open'); state.pendingConfirm = null; return;
    }
    if ($('#drawer').classList.contains('open')) closeDrawer();
  });

  /* ---------------- 定时刷新 ---------------- */
  function tickClock() {
    var d = new Date();
    var wk = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    var c = $('#clock');
    if (c) c.textContent = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      ' 周' + wk + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (state.tab === 'overview') drawOverviewChart();
      else if (state.tab === 'solar') drawSolarChart();
      if (state.openRoom) liveDrawer();
    }, 220);
  });

  /* ---------------- 初始化 ---------------- */
  function init() {
    buildRooms();
    initAlerts();

    var nowH = nowHours();
    state.energyToday = integrate(loadAt, nowH);

    for (var i = 0; i < 14; i++) simulate();
    state.noAccum = false;

    // 使日累计电量与当前实测负荷保持一致
    state.energyFactor = clamp(state.totalPower / Math.max(1, loadAt(nowH)), 0.55, 1.7);
    state.energyToday *= state.energyFactor;
    var pvF = clamp(state.pvPower / Math.max(1, pvAt(nowH)), 0.6, 1.15);
    state.pvEnergyToday = integrate(pvAt, nowH) * pvF;

    state.rooms.forEach(function (r) { r.hist = []; });

    tickClock();
    setInterval(tickClock, 1000);
    var p0 = $('#pvNow'); if (p0) p0.textContent = state.pvPower.toFixed(1);

    go('overview');

    setInterval(function () {
      simulate();
      state.tick++;
      var nb = $('#navBadge'); if (nb) nb.textContent = String(pendingAlerts().length);
      var pvNow = $('#pvNow'); if (pvNow) pvNow.textContent = state.pvPower.toFixed(1);

      if (state.tab === 'overview') {
        liveOverview();
        if (state.tick % 10 === 0) drawOverviewChart();
      } else if (state.tab === 'floors') {
        liveFloors();
      } else if (state.tab === 'solar') {
        liveSolar();
        if (state.tick % 10 === 0) drawSolarChart();
      } else if (state.tab === 'risk') {
        var sc = $('#rScore'); if (sc) sc.textContent = String(riskScore());
      }
    }, 1500);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
